
<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E293B">
  <meta name="description"
        content="မူကထအိမ် Inventory System Offline PWA">

  <title>မူကထအိမ် Inventory</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #F8FAFC;
      color: #1E293B;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      background: #1E293B;
      color: white;
      padding: 22px;
      border-radius: 14px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: white;
      border: 1px solid #CBD5E1;
    }

    .modules {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .module {
      background: white;
      padding: 18px 12px;
      border: 1px solid #CBD5E1;
      border-radius: 12px;
      text-align: center;
    }

    .note {
      margin-top: 18px;
      color: #475569;
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 360px) {
      body {
        padding: 12px;
      }

      .modules {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>မူကထအိမ်</h1>
      <div>Inventory Management System</div>
    </header>

    <div class="status" id="connectionStatus">
      ချိတ်ဆက်မှု အခြေအနေ စစ်ဆေးနေသည်...
    </div>

    <section class="modules">
      <div class="module">📦<br>Inventory Dashboard</div>
      <div class="module">📥<br>Stock IN</div>
      <div class="module">📤<br>Stock OUT</div>
      <div class="module">🗑️<br>Wastage</div>
      <div class="module">📊<br>Reports</div>
      <div class="module">🔄<br>Data Sync</div>
    </section>

    <p class="note">
      ဤသည် Offline PWA အတွက် အခြေခံစမ်းသပ်မျက်နှာပြင်ဖြစ်သည်။
      လက်ရှိ Inventory ဒေတာနှင့် မချိတ်ဆက်ရသေးပါ။
    </p>
  </main>

  <script>
    function updateConnectionStatus() {
      const el = document.getElementById("connectionStatus");

      el.textContent = navigator.onLine
        ? "🟢 Internet ချိတ်ဆက်ထားသည်"
        : "🟠 Offline ဖြစ်နေသည်";
    }

    window.addEventListener("online", updateConnectionStatus);
    window.addEventListener("offline", updateConnectionStatus);

    updateConnectionStatus();
  </script>
  
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./service-worker.js")
        .catch((error) => {
          console.error(
            "Service Worker registration failed:",
            error
          );
        });
    });
  }
</script>

<script src="./db.js?v=2"></script>


<script>
async function testLocalDatabase() {
  const status = document.getElementById("connectionStatus");

  try {
    const testProduct = {
      ProductID: "TEST-001",
      ProductName: "စမ်းသပ်ပစ္စည်း",
      Unit: "ခု"
    };

    await cacheProducts([testProduct]);

    await cacheStockSnapshot([{
      ProductID: "TEST-001",
      ProductName: "စမ်းသပ်ပစ္စည်း",
      CurrentStock: 10
    }]);

    const products = await getCachedProducts();
    const stock = await getCachedStockSnapshot();

    const foundProduct = products.find(
      p => p.productId === "TEST-001"
    );

    const foundStock = stock.find(
      s => s.productId === "TEST-001"
    );

    if (foundProduct && foundStock) {
      status.textContent =
        "✅ Database V2 အောင်မြင်ပါသည်။ " +
        "ပစ္စည်းစာရင်းနှင့် လက်ကျန်စာရင်း သိမ်းဆည်း/ပြန်ဖတ်နိုင်ပါသည်။";
    } else {
      status.textContent =
        "⚠️ Database ဖွင့်နိုင်သော်လည်း စမ်းသပ်ဒေတာ မတွေ့ပါ။";
    }
  } catch (error) {
    status.textContent = "❌ Database V2 Error: " + error.message;
    console.error(error);
  }
}
  
const INVENTORY_API_URL = "https://script.google.com/macros/s/AKfycbzqp7JmZQAHKNeqANIXyoCYhARaAY3mM6sa7Blgv6xL3oJTql_pJ9u3JhlOcRHGVw58/exec?api=inventory";

async function syncInventoryFromGoogleSheets() {
  const status = document.getElementById("connectionStatus");

  try {
    status.textContent = "⏳ Google Sheets မှ ဒေတာယူနေပါသည်...";

    const response = await fetch(INVENTORY_API_URL, {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.error || "API Error");
    }

    if (
      !Array.isArray(data.products) ||
      !Array.isArray(data.stock)
    ) {
      throw new Error("ဒေတာပုံစံ မမှန်ပါ");
    }

    const stockById = new Map(
      data.stock.map(item => [
        String(item.ProductID || ""),
        item
      ])
    );

    const snapshots = data.products
      .map(product => {
        const id = String(product.ProductID || "");
        const stock = stockById.get(id) || {};

        return {
          ProductID: id,
          ProductName: product.ProductName || "",
          Unit: product.Unit || "",
          CurrentStock: Number(stock.CurrentStock) || 0,
          AvgUnitCost: Number(stock.AvgUnitCost) || 0
        };
      })
      .filter(item => item.ProductID);

    await cacheProducts(data.products);
    await cacheStockSnapshot(snapshots);

    status.textContent =
      "✅ Sync အောင်မြင်ပါသည်။ ပစ္စည်း " +
      data.products.length +
      " မျိုးကို Local Database ထဲ သိမ်းပြီးပါပြီ။";

  } catch (error) {
    status.textContent =
      "❌ Sync မအောင်မြင်ပါ: " + error.message;

    console.error("Inventory Sync Error:", error);
  }
}

</script>


<button
  onclick="testLocalDatabase()"
  style="margin-top:16px;padding:12px 18px;border:0;border-radius:10px;background:#1E293B;color:white;font-size:16px;">
  Local Database စမ်းသပ်ရန်
</button>
  <button onclick="syncInventoryFromGoogleSheets()">
  Google Sheets မှ Sync လုပ်ရန်
</button>

</body>
</html>
